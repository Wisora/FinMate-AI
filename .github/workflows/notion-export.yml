name: Export Metrics to Notion

on:
  schedule:
    - cron: "0 9 * * 1" # every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install @notionhq/client

      # Collect metrics (example values, replace with real data collection)
      - name: Collect metrics
        run: |
          mkdir -p metrics
          echo "date,finmate_performance,budget_performance,coverage,commits,prs,issues" > metrics/export.csv
          echo "$(date +%Y-%m-%d),90,84,85,12,7,5" >> metrics/export.csv

      # Export to Notion
      - name: Export to Notion
        run: |
          node <<'EOF'
          const { Client } = require('@notionhq/client');
          const fs = require('fs');

          async function main() {
            const notion = new Client({ auth: process.env.NOTION_TOKEN });
            const data = fs.readFileSync('metrics/export.csv', 'utf8').split('\n').slice(1)[0].split(',');

            await notion.pages.create({
              parent: { database_id: process.env.NOTION_DB_ID },
              properties: {
                Date: { date: { start: data[0] } },
                "FinMate Performance": { number: parseInt(data[1]) },
                "Budget Performance": { number: parseInt(data[2]) },
                Coverage: { number: parseInt(data[3]) },
                Commits: { number: parseInt(data[4]) },
                PRs: { number: parseInt(data[5]) },
                Issues: { number: parseInt(data[6]) }
              }
            });

            console.log("Metrics exported to Notion successfully!");
          }

          main().catch(err => { console.error(err); process.exit(1); });
          EOF
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DB_ID: ${{ secrets.NOTION_DB_ID }}
