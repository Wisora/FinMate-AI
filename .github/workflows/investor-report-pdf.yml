name: Weekly Investor Reports (Executive Summary)

on:
  schedule:
    - cron: '0 10 * * 1' # every Monday at 10:00 UTC
  workflow_dispatch:

jobs:
  finmate-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install puppeteer chart.js

      - name: Generate FinMate executive report
        run: |
          mkdir -p reports
          cat <<EOF > reports/finmate-report.html
          <html>
          <head>
            <title>FinMate AI Investor Report</title>
            <style>
              body { font-family: Arial, sans-serif; color: #333; margin: 40px; }
              h1 { color: #0078d4; }
              h2 { color: #0078d4; margin-top: 30px; }
              .cover { text-align: center; margin-bottom: 40px; }
              .highlight { background: #f0f8ff; padding: 15px; border-radius: 8px; margin: 20px 0; }
              .footer { margin-top: 40px; font-size: 12px; color: #777; text-align: center; }
            </style>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
          </head>
          <body>
            <!-- Cover Page -->
            <div class="cover">
              <img src="https://your-org.github.io/assets/finmate-logo.png" alt="FinMate AI Logo" width="150"/>
              <h1>FinMate AI Weekly Investor Report</h1>
              <p>Date: $(date)</p>
            </div>

            <!-- Executive Summary -->
            <div class="highlight">
              <h2>Executive Summary</h2>
              <p><strong>Performance:</strong> 90% | <strong>Coverage:</strong> 85%</p>
              <p>Contributor activity is trending upward with strong PR and commit growth.</p>
              <p><em>Message from the Founder:</em> “This week we’ve seen steady progress in accessibility and SEO, both holding above 90%. Our contributor community continues to grow, and we’re excited about the momentum heading into next quarter.”</p>
            </div>

            <!-- Detailed Metrics -->
            <h2>Contributor Activity</h2>
            <canvas id="finmateChart"></canvas>
            <script>
              new Chart(document.getElementById('finmateChart'), {
                type: 'line',
                data: { labels: ['Week 1','Week 2','Week 3'],
                  datasets: [
                    { label: 'Commits', data: [12,18,15], borderColor: '#0078d4', fill: false },
                    { label: 'PRs', data: [5,7,6], borderColor: '#36a64f', fill: false }
                  ]
                }
              });
            </script>

            <div class="footer">© $(date +%Y) FinMate AI — Investor Relations</div>
          </body>
          </html>
          EOF

          node -e "
          const puppeteer = require('puppeteer');
          (async () => {
            const browser = await puppeteer.launch();
            const page = await browser.newPage();
            await page.goto('file://' + process.cwd() + '/reports/finmate-report.html');
            await page.pdf({ path: 'reports/investor-report-finmate.pdf', format: 'A4' });
            await browser.close();
          })();
          "

      - name: Upload FinMate report
        uses: actions/upload-artifact@v7
        with:
          name: investor-report-finmate
          path: reports/investor-report-finmate.pdf
